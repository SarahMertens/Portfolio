<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 160">
  <!-- Eigen tekening: een duiker die met het hoofd naar beneden zwemt, met oplichtende vinnen en een lamp -->
  <defs>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fe8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="30" cy="138" r="20" fill="url(#lamp)"/>
  <g fill="#03141c">
    <!-- benen -->
    <path d="M25 70 L21 34 L24 33 L29 68 Z"/>
    <path d="M35 70 L39 34 L36 33 L31 68 Z"/>
    <!-- lichaam en fles -->
    <rect x="22" y="66" width="16" height="44" rx="7"/>
    <rect x="26" y="70" width="8" height="30" rx="4" fill="#0a2a36"/>
    <!-- armen langs het lichaam -->
    <path d="M22 76 L18 104 L21 105 L25 80 Z"/>
    <path d="M38 76 L42 104 L39 105 L35 80 Z"/>
    <!-- hoofd -->
    <circle cx="30" cy="117" r="7"/>
  </g>
  <!-- lamp aan het masker -->
  <circle cx="30" cy="124" r="2" fill="#dff8ff"/>
  <!-- vinnen -->
  <path d="M21 34 Q14 16 18 4 Q22 16 24 33 Z" fill="#e8fbff"/>
  <path d="M39 34 Q46 16 42 4 Q38 16 36 33 Z" fill="#e8fbff"/>
</svg>
